syntax = "proto3";

import "robot/comm/proto/comm.proto";
import "ros2/proto/node.proto";

package robot.perception;

// Describes what a sensor measures, independently of its hardware and
// communication mechanism.
enum SensorType {
  SENSOR_INVALID = 0;
  POSITION = 1;  // Linear or rotary position, in the channel's native unit.
  IMAGE = 2;
  RANGE_SCAN = 3;
  IMU_6DOF = 4;
  FORCE_TORQUE = 5;
}

message OpenCvConfig {
  uint64 id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
  string fourcc = 5;
}

// The message presence selects the LDS-01 driver.
message Lds01Config {}

// A sensor uses either a board channel or its own communication mechanism.
message Sensor {
  string sensor_name = 1;
  uint64 id = 2;
  SensorType sensor_type = 3;

  // Board-attached acquisition path.
  string board_name = 4;
  uint32 channel = 5;

  // Device leg. Mutually exclusive with the board leg.
  robot.comm.Comm comm = 6;

  float operational_lower_limit = 7;
  float operational_upper_limit = 8;

  // Device-specific acquisition path.
  oneof sensor_config {
    OpenCvConfig opencv_config = 10;
    Lds01Config lds01_config = 11;
  }
}

message SinglePerception {
  ros2.node.Node node = 1;
  // Reserved fields from the previous perception schema.
  reserved 2, 3, 4, 5;
  reserved "perception_type", "camera", "encoder", "lidar";
  Sensor sensor = 6;
}

message Perception {
  repeated SinglePerception single_perceptions = 1;
}
