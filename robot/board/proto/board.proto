syntax = "proto3";

import "robot/comm/proto/comm.proto";

package robot.board;

// Identifies the controller responsible for channel I/O. Communication and
// drive selection are configured independently.
enum BoardType {
  BOARD_INVALID = 0;
  AM243 = 1;
  TEENSY41 = 2;
  ARDUINO_UNO = 3;
  FEETECH_BUS = 4;  // STS/SCS smart-servo register bus; the "board" is the
                    // servo's own MCU.
  HOST_GPIO = 5;    // No external controller; host pins drive the motor.
  MOCK = 6;         // Tests; channels are in-memory fakes.
  ESP32 = 7;
}

// Selects how a channel acquires input, independently of its meaning and
// communication mechanism. A channel may provide input, output, or both.
enum SignalInterface {
  SIGNAL_INVALID = 0;
  SERVO_BUS_REGISTER = 1;  // Feetech/Dynamixel present-position register read.
  QUADRATURE = 2;          // A/B incremental encoder on MCU pins.
  ANALOG_ADC = 3;          // Raw ADC count from an MCU pin.
  PDO_SLOT = 4;            // Slot in a cyclic EtherCAT input image.
}

// Selects how a channel produces output.
enum DriveInterface {
  DRIVE_INVALID = 0;
  STEP_DIR = 1;  // Pulse/direction stepper drive (TB6600, ...).
  PWM_DC = 2;
  SERVO_BUS_UART = 3;  // Feetech/Dynamixel-style register bus.
  CAN = 4;
  PDO_JOINT = 5;  // Slot in a cyclic EtherCAT process-data image.
}

message StepDirConfig {
  uint32 max_pulse_rate_hz = 1;
  bool invert_dir = 2;
  bool enable_active_low = 3;
  // MCU pin numbers sent to firmware during channel configuration.
  uint32 step_pin = 4;
  uint32 dir_pin = 5;
  uint32 enable_pin = 6;
  // STEP pulse HIGH width in microseconds. Zero uses the firmware default.
  uint32 step_pulse_width_us = 7;
}

message ServoBusConfig {
  uint32 servo_id = 1;
  // Moving-time register value in milliseconds.
  uint32 move_time_ms = 2;
}

message PwmConfig {
  uint32 frequency_hz = 1;
  float deadband = 2;
}

message HostGpioConfig {
  string gpio_chip = 1;      // e.g. "/dev/gpiochip0"
  repeated uint32 pins = 2;  // Pin group on the host header.
}

// One addressable input/output slot on a board.
message Channel {
  uint32 index = 1;
  // Output leg. DRIVE_INVALID for a sensor-only channel.
  DriveInterface drive = 2;
  // Input leg. SIGNAL_INVALID for an actuator-only channel. Required for
  // any channel a sensor binds to -- PerceptionFactory validates the
  // sensor's meaning against it.
  SignalInterface signal = 3;
  oneof drive_config {
    StepDirConfig step_dir = 10;
    ServoBusConfig servo_bus = 11;
    PwmConfig pwm = 12;
    HostGpioConfig host_gpio = 13;  // HOST_GPIO boards only.
  }
}

// Which firmware the host expects on the board; checked against the
// IDENTIFY handshake at Init(). Omitted entirely for vendor-firmware
// boards (FEETECH_BUS) and for HOST_GPIO / MOCK.
message FirmwareSpec {
  uint32 min_proto_version = 1;
}

// Selects the AM243 process-data layout.
enum Am243PdoMapping {
  AM243_PDO_MAPPING_UNSPECIFIED = 0;
  AM243_PDO_MAPPING_TI_DEMO = 1;
  AM243_PDO_MAPPING_ACTUATOR_V1 = 2;
}

message Am243Config {
  uint32 slave_index = 1;
  Am243PdoMapping pdo_mapping = 2;
  // PDO region override (offsets/sizes) so presets can pin regions instead
  // of trusting GetPdoRegion auto-discovery.
  uint32 output_offset_bytes = 3;
  uint32 input_offset_bytes = 4;
  uint32 output_size_bytes = 5;
  uint32 input_size_bytes = 6;
}

message Board {
  string name = 1;  // Referenced by actuators; cache key.
  BoardType board_type = 2;
  robot.comm.Comm comm = 3;       // Comm leg: how the PC reaches the controller
                                  // (omitted for HOST_GPIO / MOCK).
  repeated Channel channels = 4;  // Drive leg: what each slot drives.
  FirmwareSpec firmware = 5;
  oneof board_config {
    Am243Config am243_config = 10;
  }
}
